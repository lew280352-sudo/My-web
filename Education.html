  <!-- ตรวจสอบและไฮไลท์เมนูที่ active -->
    <script>
        // ฟังก์ชันนี้จะดูว่าอยู่หน้าไหน แล้วทำให้เมนูนั้นมี class active
        function updateActiveMenu() {
            const currentHash = window.location.hash || '#Home';
            const currentPage = window.location.pathname.split('/').pop().toLowerCase() || 'index.html';
            const currentPageName = currentPage.replace(/\.html$/, '');
            
            document.querySelectorAll('.menu a').forEach(link => {
                link.classList.remove('active');
                
                const href = link.getAttribute('href');
                if (!href) return;
                
                if (href.startsWith('#')) {
                    const targetId = href.slice(1).toLowerCase();
                    const currentHashId = currentHash.slice(1).toLowerCase();
                    if (targetId === currentHashId || targetId === currentPageName) {
                        link.classList.add('active');
                    }
                }
                else if (currentPage === href.toLowerCase()) {
                    link.classList.add('active');
                }
            });
        }
        
        updateActiveMenu(); // เรียกเมื่อโหลดหน้า
        window.addEventListener('hashchange', updateActiveMenu); // ฟังการเปลี่ยน # ใน URL
    </script>
